maintenance:
  - run: |
      cd /home/ubuntu/repos/426-final && npm install
knowledge:
  - name: build-and-run
    contents: |
      This is a Three.js game (Core Crawler) using webpack 4.
      Node.js 22 requires the legacy OpenSSL provider flag for webpack 4.
      Build: NODE_OPTIONS=--openssl-legacy-provider npm run build
      Dev server: NODE_OPTIONS=--openssl-legacy-provider npm start  (runs on http://localhost:8080)
      Format: node node_modules/prettier/bin-prettier.js --write '*.js' 'src/**/*.js'
      No test suite is configured.
